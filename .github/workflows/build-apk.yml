name: Build Eisner APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Add Android platform
      run: npx cap add android

    - name: Sync web assets to Android
      run: npx cap sync android

    - name: Set app name and fix config
      run: |
        # Fix app name to "Eisner"
        sed -i 's/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">Eisner<\/string>/' android/app/src/main/res/values/strings.xml
        cat android/app/src/main/res/values/strings.xml

        # Fix Gradle version
        sed -i 's/gradle-8.0.2-all/gradle-8.2-all/g' android/gradle/wrapper/gradle-wrapper.properties
        sed -i 's/gradle-8.0-all/gradle-8.2-all/g' android/gradle/wrapper/gradle-wrapper.properties
        sed -i 's/gradle-8.1-all/gradle-8.2-all/g' android/gradle/wrapper/gradle-wrapper.properties

        # Add junrar dependency
        sed -i '/dependencies {/a\    implementation \"com.github.junrar:junrar:7.5.5\"' android/app/build.gradle || true

        # Set targetSdk to 34 if below
        sed -i 's/targetSdk [0-9]*/targetSdk 34/' android/app/build.gradle || true

    - name: Inject Eisner icons
      run: |
        mkdir -p android/app/src/main/res/mipmap-mdpi
        echo 'iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAAfklEQVR42u3Zyw2AIBAFQM5YmJXbi11oBwaNfBbmJRxJ3lw2gU1JpF1y3q5WJ2TpXzEjFP8MGbH8K0RowMjlixAAPQERyj8iSi+fx17tAAAAdAKEn0IAAKsDak0bAAAAUwgAAMCDBgBgMoDvRZ+7MwOsmCz6Jly3rr2pl8q5AR6zSC6qUkg9AAAAAElFTkSuQmCC' | base64 -d > android/app/src/main/res/mipmap-mdpi/ic_launcher.png
        cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
        mkdir -p android/app/src/main/res/mipmap-hdpi
        echo '' | base64 -d > android/app/src/main/res/mipmap-hdpi/ic_launcher.png
        cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
        mkdir -p android/app/src/main/res/mipmap-xhdpi
        echo '' | base64 -d > android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
        cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
        mkdir -p android/app/src/main/res/mipmap-xxhdpi
        echo '' | base64 -d > android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
        cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
        mkdir -p android/app/src/main/res/mipmap-xxxhdpi
        echo '' | base64 -d > android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Build debug APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Rename APK
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk eisner.apk
        echo "APK ready: $(du -h eisner.apk)"

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: eisner
        path: eisner.apk
        retention-days: 90

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: "Eisner v${{ github.run_number }}"
        body: |
          ## Eisner Comic Reader

          ### Instalar en Android:
          1. Descarga **eisner.apk**
          2. Abre el archivo en tu móvil
          3. Permite "Instalar de fuentes desconocidas" si te lo pide
          4. ¡Listo!

          ### Formatos soportados:
          CBZ · CBR · RAR · ZIP · PDF
        files: eisner.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
