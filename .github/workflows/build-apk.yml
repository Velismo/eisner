name: Build Eisner APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install dependencies
      run: npm install

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: temurin

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Add Android platform
      run: npx cap add android

    - name: Sync web assets
      run: npx cap sync android

    - name: Fix Gradle and config
      run: |
        sed -i "s/gradle-8\.0\.[0-9]-all/gradle-8.2-all/g" android/gradle/wrapper/gradle-wrapper.properties
        sed -i "s/gradle-8\.1\.[0-9]-all/gradle-8.2-all/g" android/gradle/wrapper/gradle-wrapper.properties
        sed -i 's|<string name="app_name">.*</string>|<string name="app_name">Eisner</string>|' android/app/src/main/res/values/strings.xml
        echo >> android/app/build.gradle
        echo 'dependencies { implementation "com.github.junrar:junrar:7.5.5" }' >> android/app/build.gradle
        grep -q "jitpack" android/build.gradle || sed -i "/mavenCentral()/a\        maven { url \"https://jitpack.io\" }" android/build.gradle

    - name: Inject icons
      run: |
        mkdir -p android/app/src/main/res/mipmap-mdpi
        echo "iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAAfklEQVR42u3Zyw2AIBAFQM5YmJXbi11oBwaNfBbmJRxJ3lw2gU1JpF1y3q5WJ2TpXzEjFP8MGbH8K0RowMjlixAAPQERyj8iSi+fx17tAAAAdAKEn0IAAKsDak0bAAAAUwgAAMCDBgBgMoDvRZ+7MwOsmCz6Jly3rr2pl8q5AR6zSC6qUkg9AAAAAElFTkSuQmCC" | base64 -d > android/app/src/main/res/mipmap-mdpi/ic_launcher.png
        cp android/app/src/main/res/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
        mkdir -p android/app/src/main/res/mipmap-hdpi
        echo "" | base64 -d > android/app/src/main/res/mipmap-hdpi/ic_launcher.png
        cp android/app/src/main/res/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
        mkdir -p android/app/src/main/res/mipmap-xhdpi
        echo "" | base64 -d > android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
        cp android/app/src/main/res/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
        mkdir -p android/app/src/main/res/mipmap-xxhdpi
        echo "" | base64 -d > android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
        cp android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
        mkdir -p android/app/src/main/res/mipmap-xxxhdpi
        echo "" | base64 -d > android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

    - name: Add RAR plugin
      run: |
        mkdir -p android/app/src/main/java/com/velismo/eisner/plugins
        python3 << 'PY'
content = open("android/app/src/main/java/com/velismo/eisner/plugins/RarPlugin.java","w")
content.write("""package com.velismo.eisner.plugins;
import android.util.Base64;
import com.getcapacitor.JSArray;
import com.getcapacitor.JSObject;
import com.getcapacitor.Plugin;
import com.getcapacitor.PluginCall;
import com.getcapacitor.PluginMethod;
import com.getcapacitor.annotation.CapacitorPlugin;
import com.github.junrar.Archive;
import com.github.junrar.rarfile.FileHeader;
import java.io.ByteArrayOutputStream;
import java.io.File;
import java.util.Arrays;
import java.util.ArrayList;
import java.util.List;
@CapacitorPlugin(name = "RarPlugin")
public class RarPlugin extends Plugin {
    private static final List<String> IMG = Arrays.asList("jpg","jpeg","png","webp","gif","bmp");
    @PluginMethod
    public void extractImages(PluginCall call) {
        String p = call.getString("path");
        if (p == null) { call.reject("No path"); return; }
        try {
            Archive a = new Archive(new File(p));
            List<FileHeader> all = a.getFileHeaders();
            List<FileHeader> imgs = new ArrayList<>();
            for (FileHeader h : all) {
                if (!h.isDirectory()) {
                    String n = h.getFileName().toLowerCase();
                    String e = n.contains(".") ? n.substring(n.lastIndexOf(".")+1) : "";
                    if (IMG.contains(e)) imgs.add(h);
                }
            }
            imgs.sort((x,y) -> {
                String nx = x.getFileName().replaceAll("[^0-9]","");
                String ny = y.getFileName().replaceAll("[^0-9]","");
                if (!nx.isEmpty() && !ny.isEmpty()) try { return Integer.parseInt(nx)-Integer.parseInt(ny); } catch(Exception ex){}
                return x.getFileName().compareTo(y.getFileName());
            });
            JSArray pages = new JSArray();
            for (FileHeader h : imgs) {
                ByteArrayOutputStream b = new ByteArrayOutputStream();
                a.extractFile(h, b);
                String b64 = Base64.encodeToString(b.toByteArray(), Base64.NO_WRAP);
                String n = h.getFileName();
                String e = n.contains(".") ? n.substring(n.lastIndexOf(".")+1).toLowerCase() : "jpg";
                String mime = e.equals("png") ? "image/png" : e.equals("webp") ? "image/webp" : "image/jpeg";
                JSObject pg = new JSObject();
                pg.put("name", n); pg.put("data", b64); pg.put("mime", mime);
                pages.put(pg);
            }
            a.close();
            JSObject r = new JSObject();
            r.put("pages", pages); r.put("count", imgs.size());
            call.resolve(r);
        } catch (Exception e) { call.reject("RAR: " + e.getMessage()); }
    }
}
""")
content.close()
PY
        MAIN=$(find android/app/src/main/java -name "MainActivity.java" | head -1)
        python3 << 'PY2'
import sys
path = open("/tmp/mainpath").read().strip()
c = open(path).read()
if "RarPlugin" not in c:
    c = c.replace("import com.getcapacitor.BridgeActivity;",
        "import com.getcapacitor.BridgeActivity;\nimport com.velismo.eisner.plugins.RarPlugin;")
    c = c.replace("public class MainActivity extends BridgeActivity {",
        "public class MainActivity extends BridgeActivity {\n  @Override\n  public void onCreate(android.os.Bundle b){registerPlugin(RarPlugin.class);super.onCreate(b);}")
    open(path,"w").write(c)
    print("Registered")
PY2

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Build APK
      run: cd android && ./gradlew assembleDebug

    - name: Rename APK
      run: cp android/app/build/outputs/apk/debug/app-debug.apk eisner.apk

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: eisner
        path: eisner.apk
        retention-days: 90

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: Eisner v${{ github.run_number }}
        body: Descarga eisner.apk e instala en Android. Soporta CBZ CBR RAR ZIP PDF.
        files: eisner.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
