name: Build Eisner APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Add Android platform
      run: npx cap add android

    - name: Sync web assets to Android
      run: npx cap sync android

    - name: Debug - show generated files
      run: |
        echo "=== ROOT build.gradle ==="
        cat android/build.gradle
        echo ""
        echo "=== APP build.gradle ==="
        cat android/app/build.gradle
        echo ""
        echo "=== settings.gradle ==="
        cat android/settings.gradle
        echo ""
        echo "=== gradle-wrapper.properties ==="
        cat android/gradle/wrapper/gradle-wrapper.properties  

    - name: Fix Gradle version and config
      run: |
        # Fix Gradle version
        sed -i 's/gradle-8.0.2-all/gradle-8.2-all/g' android/gradle/wrapper/gradle-wrapper.properties
        sed -i 's/gradle-8.0-all/gradle-8.2-all/g' android/gradle/wrapper/gradle-wrapper.properties
        
        # Add junrar dependency to app/build.gradle (only app level, not root)
        sed -i '/dependencies {/a\    implementation "com.github.junrar:junrar:7.5.5"' android/app/build.gradle
        
        # Add jitpack repo to settings.gradle or build.gradle
        if [ -f android/settings.gradle ]; then
          sed -i '/repositories {/a\        maven { url "https://jitpack.io" }' android/settings.gradle
        fi
        
        echo "=== app/build.gradle ===" 
        cat android/app/build.gradle

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Fix Gradle version
      run: |
        sed -i 's/gradle-8.0.2-all/gradle-8.2-all/g' android/gradle/wrapper/gradle-wrapper.properties
        sed -i 's/gradle-8.0-all/gradle-8.2-all/g' android/gradle/wrapper/gradle-wrapper.properties
        cat android/gradle/wrapper/gradle-wrapper.properties  

    - name: Build debug APK
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: eisner-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v${{ github.run_number }}
        name: "Eisner v${{ github.run_number }}"
        body: |
          ## Eisner Comic Reader
          
          ### Instalar en Android:
          1. Descarga `eisner.apk`
          2. Abre el archivo en tu móvil
          3. Permite "Instalar de fuentes desconocidas" si te lo pide
          4. ¡Listo!
          
          ### Novedades:
          - Soporte nativo CBR/RAR
          - Acceso completo al sistema de archivos
          - Guided View con detección de viñetas
        files: android/app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
